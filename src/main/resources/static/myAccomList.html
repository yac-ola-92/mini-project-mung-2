<script>
    async function getId () {
        try{
            const response = await fetch("/getId");
            if(!response.ok){
                throw new Error("eeeeeeeerrrrrroooorrrrrrr");
            }
            const data = await response.text();
            console.log('getId 아이디 요청 : '+data);

            putId(data);
        }catch (error){
            console.error(error,"error");
        }
    }
    getId();

   async function putId(user_id){
       console.log('putId함수 시작 : '+user_id);
       if (user_id === null || user_id === undefined || isNaN(user_id)) {
           console.error("잘못된 user_id:", user_id);
           return;  // user_id가 잘못되었으면 함수를 종료
       }
        try{
            console.log('putId함수 응답요청 1 ');
            const response = await fetch(`/myAccomList/${user_id}`);
            console.log('putId함수 응답요청 2 ');
            console.log(response.status);
            if(!response.ok){
                throw new Error('error 발생!!!');
            }
            console.log('putId함수 응답요청 3 ');
            const data = await response.json();
            console.log('putId함수 응답요청 4 ');
            displayAccom(data);
        }catch(error){
            console.log('error 발생 : '+ error);
        }
    }

    async function displayAccom(data){
        console.log('들어온 값: '+ data);
        const accomBox = document.querySelector('.accom-box');

        if(data==null){
            accomBox.innerHTML =`<h1>등록된 숙소가 없습니다.</h1>`;

        }else{
            data.forEach((list) =>{
                const newDiv = document.createElement('div');

                newDiv.innerHTML =  `
                <div class="accom-img-box">
                <img class="acoom-img" src="${list.accom_images_url.split(',')[0]}">
                </div>
                <div class="accom-title">
                <h3 class="accom-name">${list.accom_name}</h3>
                <input type="hidden" class="accom-id" value="${list.accom_id}">
                </div>
                <div class="btn-box">
                <button class="list-btn" onclick="update(${list.accom_id})">수정</button>
                <button class="list-btn" onclick="remove(${list.accom_id})">삭제</button>
                </div>`

                newDiv.style.display='flex';
                newDiv.classList.add('accom-content');
                accomBox.appendChild(newDiv);
            });
        }
    }

            function remove(accom_id){
                console.log('삭제할 숙소 ID: ', accom_id);
               try {
                   fetch(`/accom_delete/${accom_id}`,{
                           method:'DELETE',
               })
                   .then(response => response.json())
                   .then(data => {
                       console.log('숙소 삭제 성공')
                       alet('숙소를 삭제하였습니다.')
                   });

                }catch (error){
                   console.error('에러 발생----------' , error);
               }
            }

            function update(accom_id){
                console.log('수정할 숙소 ID: ', accom_id);
                window.location = '/myAccom/edit/'+accom_id;
            }
    function registerForm(){
        console.log('등록 폼으로 이동합니다');
        window.location = '/registerForm'
    }

</script>
