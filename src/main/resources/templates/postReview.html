<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>게시판</title>
    <meta name="description" content="게시판 페이지">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.png">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <link rel="stylesheet" href="/assets/css/post.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/748b44d03f.js" crossorigin="anonymous"></script>
    <style>
        .header {
            list-style-type: none;
            margin: 5px 5px 18px 0;
            padding: 0;
            overflow: hidden;
        }
        .header-li {
            float: left;
            margin-left : 10px;
        }

        .review-table-container {
            background-color: #fff9f0;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }

        .review-table-container h1 {
            text-align: center;
            font-size: 28px;
            color: #bc915e;
            font-weight: bold;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ecd9bf;
        }

        th {
            background-color: #bc915e;
            color: white;
        }

        .deleteButton {
            background-color: #bc915e;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .deleteButton:hover {
            background-color: #fff9f0;
            color: #bc915e;
            border: 2px solid #bc915e;
        }

        .back-to-reviews {
            background-color: #bc915e;
            color: white;
            border: none;
            padding: 5px 10px;
            width: 100px;
            border-radius: 5px;
            cursor: pointer;
            display: block;  /* 블록 레벨 요소로 변환 */
            margin: 20px auto;  /* 좌우 자동 마진으로 가운데 정렬 */
            text-align: center;  /* 버튼 안의 텍스트를 가운데 정렬 */
        }

        .back-to-reviews:hover {
            background-color: #fff9f0;
            color: #bc915e;
            border: 2px solid #bc915e;
        }
    </style>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const deleteButtons = document.querySelectorAll(".deleteButton");

            deleteButtons.forEach(button => {
                button.addEventListener("click", function () {
                    const review_id = this.getAttribute("data-id");

                    if (confirm("정말로 삭제하시겠습니까?")) {
                        fetch(`/${review_id}`, {
                            method: "DELETE",
                            // headers: {
                            //     "Content-Type": "application/json"
                            // }
                        })
                            .then(response => {
                                if (response.ok) {
                                    alert("리뷰가 삭제되었습니다.");
                                    location.reload(); // 페이지 새로고침
                                } else {
                                    return response.text().then(text => {
                                        throw new Error(text);
                                    });
                                }
                            })
                            .catch(error => {
                                console.error("Error:", error);
                                alert("리뷰 삭제 중 오류가 발생했습니다. 다시 시도해 주세요.");
                            });
                    }
                });
            });
        });
    </script>
</head>
<body>
<header>
    <!-- Header Start -->
    <div class="header-bottom header-sticky"
         style="background-color:#fff9f0; height:150px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <!-- 로고 영역 -->
        <div class="logo" style="margin-bottom: 10px; margin-top:10px">
            <a href="/mainPage"><img style="margin-top: 20px; width: 100px;" src="/assets/img/logo/munglogo.png"
                                     alt="Logo"></a>
        </div>
        <!-- 네비게이션 메뉴 영역 -->
        <nav>
            <ul class="header">
                <li class="header-li"><a href="/mainPage" style="color:#bc915e;">메인</a></li>
                <li class="header-li"><a href="/postMain" style="color:#bc915e;">게시판</a></li>
                <li class="header-li"><a href="/myPage" style="color:#bc915e;">마이페이지</a></li>
                <li class="header-li"><a href="/login" id="login" th:if="${session.userInfo == null}">로그인</a></li>
                <li class="header-li"><a href="/logout" id="logout" th:if="${session.userInfo != null}">로그아웃</a></li>
            </ul>
        </nav>
    </div>


    <!-- Header End -->
</header>
<main>
    <div class="review-table-container">
        <h1>내 리뷰</h1>
        <table>
            <thead>
            <tr>
                <th>숙소 이름</th>
                <th>방 이름</th>
                <th>리뷰</th>
                <th>평점</th>
                <th>작성일</th>
                <th>삭제</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="review : ${reviews}">
                <td th:text="${review.comment}"></td>
                <td th:text="${review.rating}"></td>
                <td th:text="${#dates.format(review.created_at, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <button class="deleteButton" th:data-id="${review.review_id}">삭제</button>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
        <p th:if="${reviews == null or reviews.isEmpty()}" class="no-review-message">작성된 리뷰가 없습니다.</p>
        <a class="back-to-reviews" th:href="@{/reviews/create}">리뷰 작성</a>
    <a class="back-to-main" href="/postMain">
        <i class="fas fa-arrow-left"></i> 메인으로
    </a>
    </div>
</main>
<!-- Footer -->
<footer>
    <div class="footer-area footer-padding footer-bg" style="background-color: #fff9f0;">
        <div class="container">
            <div class="row d-flex justify-content-between">
                <div class="col-xl-3 col-lg-3 col-md-5 col-sm-6">
                    <div class="single-footer-caption mb-50">
                        <div class="footer-logo">
                            <a href="index.html"><img src="/assets/img/logo/logo.png" alt="Logo" style="height: 5em;"></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</footer>

<script src="/assets/js/vendor/jquery-1.12.4.min.js"></script>
<script src="/assets/js/popper.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
</body>
</html>
