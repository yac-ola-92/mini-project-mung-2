<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 - 내 리뷰</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .review-table-container {
            background-color: #fff9f0;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }

        .review-table-container h1 {
            text-align: center;
            font-size: 28px;
            color: #bc915e;
            font-weight: bold;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ecd9bf;
        }

        th {
            background-color: #bc915e;
            color: white;
        }

        .deleteButton {
            background-color: #bc915e;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .deleteButton:hover {
            background-color: #fff9f0;
            color: #bc915e;
            border: 2px solid #bc915e;
        }

        .back-to-reviews {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            color: #bc915e;
        }

        .back-to-reviews:hover {
            color: #bc915e;
            text-decoration: underline;
        }
    </style>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const deleteButtons = document.querySelectorAll(".deleteButton");

            deleteButtons.forEach(button => {
                button.addEventListener("click", function () {
                    const reviewId = this.getAttribute("data-id");

                    if (confirm("정말로 삭제하시겠습니까?")) {
                        fetch(`/reviews/${reviewId}`, {
                            method: "DELETE",
                            headers: {
                                "Content-Type": "application/json"
                            }
                        })
                            .then(response => {
                                if (response.ok) {
                                    alert("리뷰가 삭제되었습니다.");
                                    location.reload(); // 페이지 새로고침
                                } else {
                                    return response.text().then(text => {
                                        throw new Error(text);
                                    });
                                }
                            })
                            .catch(error => {
                                console.error("Error:", error);
                                alert("리뷰 삭제 중 오류가 발생했습니다. 다시 시도해 주세요.");
                            });
                    }
                });
            });
        });
    </script>
</head>

<body>

<header>
    <div class="header-area" style="background-color: #fff9f0;">
        <div class="main-header">
            <div class="header-top top-bg d-none d-lg-block" style="background-color: #f2e2cc;">
                <div class="container">
                    <div class="row justify-content-between align-items-center">
                        <div class="col-lg-8">
                            <div class="header-info-left">
                                <ul>
                                    <li>needhelp@gotrip.com</li>
                                    <li>666 569 025077</li>
                                    <li>Brooklyn Street, New York</li>
                                </ul>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="header-info-right f-right">
                                <ul class="header-social">
                                    <li><a href="#"><i class="fab fa-twitter"></i></a></li>
                                    <li><a href="#"><i class="fab fa-linkedin-in"></i></a></li>
                                    <li><a href="#"><i class="fab fa-facebook-f"></i></a></li>
                                    <li><a href="#"><i class="fab fa-pinterest-p"></i></a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-bottom header-sticky" style="background-color: #fff9f0;">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-xl-2 col-lg-2 col-md-1">
                            <div class="logo">
                                <a href="main.html"><img src="/assets/img/logo/logo.png" alt="Logo" style="height: 5em"></a>
                            </div>
                        </div>
                        <div class="col-xl-10 col-lg-10 col-md-10">
                            <div class="main-menu f-right d-none d-lg-block">
                                <nav>
                                    <ul id="navigation">
                                        <li><a th:href="@{/register_accom}">숙소 예약</a></li>
                                        <li><a th:href="@{/postMain}">게시판</a></li>
                                        <li><a th:href="@{/myPage}">마이페이지</a></li>
                                        <li><a th:if="${userInfo == null}" href="/login" class="btn-log">로그인</a></li>
                                        <li><a th:if="${userInfo != null}" href="/logout" class="btn-log">로그아웃</a></li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="mobile_menu d-block d-lg-none"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="review-table-container">
        <h1>내 리뷰</h1>
        <table>
            <thead>
            <tr>
                <th>숙소 이름</th>
                <th>방 이름</th>
                <th>리뷰</th>
                <th>평점</th>
                <th>작성일</th>
                <th>삭제</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="review : ${reviews}">
                <td th:text="${review.accom_name}"></td>
                <td th:text="${review.room_name}"></td>
                <td th:text="${review.comment}"></td>
                <td th:text="${review.rating}"></td>
                <td th:text="${#dates.format(review.created_at, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <button class="deleteButton" th:data-id="${review.review_id}">삭제</button>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
        <p th:if="${reviews == null or reviews.isEmpty()}" class="no-review-message">작성된 리뷰가 없습니다.</p>
        <a class="back-to-reviews" th:href="@{/reviews/create}">리뷰 작성</a>
    </div>
</main>

<footer>
    <div class="footer-area footer-padding footer-bg" style="background-color: #fff9f0; padding: 30px;">
        <div class="container">
            <div class="footer-logo">
                <a href="/mainPage"><img src="/assets/img/logo/munglogo.png" style="width: 150px;" alt=""></a>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
