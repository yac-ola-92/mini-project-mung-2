<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>리뷰 작성</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .review-form-container {
            background-color: #fff9f0;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
            max-width: 600px;
            margin: 0 auto;
        }

        .review-form-container h1 {
            text-align: center;
            font-size: 28px;
            color: #bc915e;
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 16px;
            color: #555;
        }

        .form-control {
            border: 2px solid #bc915e;
            border-radius: 5px;
            padding: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .form-control:focus {
            border-color: #bc915e;
            outline: none;
        }

        button[type="submit"] {
            background-color: #bc915e;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
        }

        button[type="submit"]:hover {
            background-color: #fff9f0;
            color: #bc915e;
            border: 2px solid #bc915e;
        }

        .back-to-reviews {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            color: #bc915e;
        }

        .back-to-reviews:hover {
            color: #bc915e;
            text-decoration: underline;
        }
    </style>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const reviewForm = document.getElementById("reviewForm");
            if (reviewForm) {
                reviewForm.addEventListener("submit", function (event) {
                    event.preventDefault(); // 기본 제출 동작 중단

                    const formData = Object.fromEntries(new FormData(reviewForm));
                    fetch(reviewForm.action, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(formData),
                    })
                        .then(response => {
                            if (response.ok) {
                                return response.text();
                            }
                            throw new Error("리뷰 등록 중 문제가 발생했습니다.");
                        })
                        .then(data => {
                            alert("리뷰가 성공적으로 등록되었습니다.");
                            window.location.href = "/reviews/${reviewId}"; // 성공 시 목록 페이지로 이동
                        })
                        .catch(error => {
                            alert(error.message);
                        });
                });
            }
        });
    </script>
</head>
<body>
<header>
    <div class="header-area" style="background-color: #fff9f0;">
        <div class="main-header">
            <div class="header-top top-bg d-none d-lg-block" style="background-color: #f2e2cc;">
                <div class="container">
                    <div class="row justify-content-between align-items-center">
                        <div class="col-lg-8">
                            <div class="header-info-left">
                                <ul>
                                    <li>needhelp@gotrip.com</li>
                                    <li>666 569 025077</li>
                                    <li>Brooklyn Street, New York</li>
                                </ul>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="header-info-right f-right">
                                <ul class="header-social">
                                    <li><a href="#"><i class="fab fa-twitter"></i></a></li>
                                    <li><a href="#"><i class="fab fa-linkedin-in"></i></a></li>
                                    <li><a href="#"><i class="fab fa-facebook-f"></i></a></li>
                                    <li><a href="#"><i class="fab fa-pinterest-p"></i></a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-bottom header-sticky" style="background-color: #fff9f0;">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-xl-2 col-lg-2 col-md-1">
                            <div class="logo">
                                <a href="main.html"><img src="/assets/img/logo/logo.png" alt="Logo" style="height: 5em"></a>
                            </div>
                        </div>
                        <div class="col-xl-10 col-lg-10 col-md-10">
                            <div class="main-menu f-right d-none d-lg-block">
                                <nav>
                                    <ul id="navigation">
                                        <li><a th:href="@{/register_accom}">숙소 예약</a></li>
                                        <li><a th:href="@{/postMain}">게시판</a></li>
                                        <li><a th:href="@{/myPage}">마이페이지</a></li>
                                        <li><a th:if="${userInfo == null}" href="/login" class="btn-log">로그인</a></li>
                                        <li><a th:if="${userInfo != null}" href="/logout" class="btn-log">로그아웃</a></li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="mobile_menu d-block d-lg-none"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="review-form-container">
        <h1>리뷰 작성</h1>
        <div th:if="${error}" class="alert alert-danger">
            <p th:text="${error}"></p>
        </div>
        <div th:if="${rv_id == null}" class="alert alert-warning">
            <p>리뷰를 작성할 수 없습니다. 예약 정보가 없습니다.</p>
            <a class="btn btn-warning" th:href="@{/register_accom}">예약하러 가기</a>
        </div>
        <form id="reviewForm" th:if="${rv_id != null}" th:action="@{/reviews/create}" method="post">
            <input type="hidden" name="rv_id" th:value="${rv_id}">
            <input type="hidden" name="user_id" th:value="${user_id}">
            <div class="form-group">
                <label class="form-label" for="rating">평점</label>
                <input type="number" id="rating" name="rating" class="form-control" min="1" max="5" required>
                <small class="form-text text-muted">1에서 5까지의 점수를 입력하세요.</small>
            </div>
            <div class="form-group">
                <label class="form-label" for="comment">후기</label>
                <textarea id="comment" name="comment" class="form-control" rows="4" required></textarea>
                <small class="form-text text-muted">후기를 입력해 주세요.</small>
            </div>
            <button type="submit">리뷰 등록</button>
        </form>
        <a class="back-to-reviews" th:href="@{/mypage/reviews}">리뷰 목록으로 돌아가기</a>
    </div>
</main>
<footer>
    <div class="footer-area footer-padding footer-bg" style="background-color: #fff9f0; padding: 30px;">
        <div class="container">
            <div class="footer-logo">
                <a href="/mainPage"><img src="/assets/img/logo/munglogo.png" style="width: 150px;" alt=""></a>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
