<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>게시판</title>
    <meta name="description" content="게시판 페이지">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.png">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <link rel="stylesheet" href="/assets/css/post.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/748b44d03f.js" crossorigin="anonymous"></script>
    <style>
        .header {
            list-style-type: none;
            margin: 5px 5px 18px 0;
            padding: 0;
            overflow: hidden;
        }
        .header-li {
            float: left;
            margin-left : 10px;
        }

        .content-wrapper {
            width: 100%;
            margin: 0 auto; /* 중앙 정렬 */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; /* 섹션 간 간격 조정 */
            padding: 20px; /* 화면 상하 여백 추가 */
        }

        /* 카테고리 섹션 */
        .category-section {
            width: 100%; /* 부모 요소의 전체 너비 */
            max-width: 800px; /* 게시글 섹션과 같은 너비로 맞춤 */
            background-color: #fff9f0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            margin: 20px auto; /* 게시글과 간격 조정 */
        }

        .blog_details {
            width: 90%; /* 부모 요소의 90% 너비 */
            max-width: 1200px; /* 최대 너비 제한 */
            background-color: #f2e2cc;
            border-radius: 15px;
            padding: 40px; /* 내부 여백 */
            text-align: left;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2); /* 그림자 효과 */
            font-size: 18px; /* 기본 텍스트 크기 */
            line-height: 1.8; /* 줄 간격 조정 */
            margin: 20px auto; /* 중앙 정렬 및 여백 */
        }

        .post-content {
            display: block;
            margin-top: 20px;
            margin-bottom: 20px;
            word-wrap: break-word; /* 긴 단어 줄바꿈 */
            font-size: 18px;
            color: #333;
            background: none;
            padding: 0;
        }

        .blog_details h2 {
            font-size: 28px; /* 제목 크기 키움 */
            font-weight: bold;
            color: #333; /* 더 어두운 색상 사용 */
        }

        .blog_details span {
            font-size: 18px; /* 날짜 및 조회수 글씨 크기 */
            color: #666; /* 부드러운 보조 색상 */
        }

        .category-section h4 {
            display: flex;
            align-items: center; /* 가운데 정렬 */
            margin-bottom: 10px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }

        .category-section ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .category-section li a {
            display: inline-block;
            padding: 8px 20px;
            margin: 0 5px; /* 버튼 간격 */
            text-decoration: none;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .category-section li a:hover {
            color: #dab896;
            color: #fff;
        }

        .category-section li a.active {
            background-color: #dab896;
            color: #fff;
            font-weight: bold;
        }

        .blog-head {
            font-size: 40px; /* 제목 크기를 더 키움 */
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
        }

        .blog-info-link span {
            font-size: 22px; /* 세부 정보의 글자 크기를 작게 */
            color: #333; /* 조금 더 흐린 색상으로 강조 약화 */
        }

        .blog-image {
            display: block; /* 블록 요소로 설정 */
            max-width: 100%; /* 부모 요소 크기에 맞게 설정 */
            height: auto; /* 비율에 맞게 높이 설정 */
            margin: 20px auto; /* 가운데 정렬 및 간격 추가 */
            border-radius: 10px; /* 둥근 모서리 */
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1); /* 그림자 추가 */
        }

        .button-container {
            margin-top: 15px;
            margin-left: 15px;
        }

        .back-to-main {
            position: absolute; /* 위치를 절대값으로 설정 */
            display: inline-block;
            padding: 10px 25px;
            background-color: #f2e2cc;
            color: #333;
            font-weight: bold;
            border-radius: 30px;
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1); /* 부드러운 그림자 */
        }

        .back-to-main:hover {
            background-color: #e6d3b8;
            transform: scale(1.05); /* 호버 시 약간 확대 */
            color: #000;
        }

        img {
            width: 300px;
            height: auto;
            object-fit: cover;
        }

        /* 댓글 영역 스타일 */
        .comment-form {
            width: 100%; /* 부모 폭에 맞춤 */
            max-width: 1000px; /* 최대 폭 제한 */
            padding: 20px;
        }

        .comment-area {
            width: 100%;
            max-width: 800px;
            margin: 20px auto; /* 댓글 영역 중앙 정렬 */
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .comment-content {
            font-size: 18px;
            line-height: 1.6; /* 가독성을 위한 줄 간격 */
            color: #333;
        }

        /* 댓글 리스트를 세로로 정렬 */
        .comment-list {
            display: flex;
            flex-direction: column; /* 세로 방향 정렬 */
            gap: 15px; /* 댓글 간 간격 추가 */
        }

        /* 댓글 개별 박스 */
        .single-comment {
            display: flex;
            flex-direction: column; /* 댓글 내용이 위-아래로 나열 */
            padding: 15px; /* 여백을 줄여 크기 조정 */
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        /* 댓글 작성 영역 */
        .comment-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        /* 댓글 본문 및 버튼 영역 */
        .single-comment .desc {
            display: flex;
            flex-direction: column;
        }

        .single-comment .like-dislike-buttons {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 댓글 수정 입력 필드 */
        .edit-comment-input {
            width: 100%;
            display: none; /* 수정 모드에서만 보이도록 설정 */
            margin-bottom: 10px;
        }

        /* 좋아요, 싫어요 버튼 정렬 */
        .like-dislike-buttons {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        /* 좋아요/싫어요 버튼 스타일 */
        .like-dislike-buttons button {
            font-size: 18px; /* 아이콘 크기 증가 */
            padding: 5px 10px; /* 버튼 크기 증가 */
            border: none;
            background: none;
            cursor: pointer;
            transition: transform 0.2s ease; /* 클릭 시 애니메이션 */
            margin-left: 5px;
        }

        .btn-save, .btn-cancel {
            position: relative;
            z-index: 10;  /* 버튼이 다른 요소 위로 올라오게 설정 */
        }

        .like-dislike-buttons span {
            font-size: 16px; /* 카운트 텍스트 크기 */
            margin-left: 5px; /* 버튼과 숫자 간격 */
        }

        .like-dislike-buttons button:hover {
            transform: scale(1.2); /* 버튼 확대 효과 */
        }

        /* 댓글 수정 및 삭제 버튼 기본 스타일 */
        .single-comment .btn {
            padding: 10px 15px; /* 버튼 내 여백 증가 */
            margin-right: 10px; /* 버튼 간격 설정 */
            font-size: 16px; /* 텍스트 크기 증가 */
            border-radius: 6px; /* 버튼 모서리 둥글게 */
            transition: background-color 0.3s ease, transform 0.2s ease; /* 호버 효과 */
        }

        /* 수정 모드에서 보일 저장, 취소 버튼 스타일 */
        .single-comment .btn-primary, /* 저장 버튼 */
        .single-comment  .btn-danger/* 취소 버튼 */ {
            display: inline-block;
            margin-top: 10px;
            background-color: #e6d3b8;
            color: black;
        }

        /* 버튼 컨테이너 스타일 */
        .btn-container {
            display: flex; /* Flexbox 사용 */
            flex-direction: row; /* 가로 정렬 */
            align-items: center; /* 수직 가운데 정렬 */
            justify-content: flex-start; /* 왼쪽 정렬 */
            gap: 10px; /* 버튼 간격 설정 */
        }

        .single-comment .btn-primary:hover {
            background-color: #e6d3b8; /* 호버 시 색상 변화 */
            transform: scale(1.05); /* 호버 시 버튼 확대 */
        }

        .btn-common {
            padding: 5px 10px; /* 버튼 내 여백 줄이기 */
            height: 30px; /* 버튼 높이 설정 */
            width: auto; /* 버튼 너비 자동으로 설정 */
            border-radius: 4px; /* 모서리 둥글게 */
            background-color: #fff9f0; /* 버튼 배경색 */
            margin-right: 5px; /* 버튼 간격 설정 */
            color: black;
        }

        .single-comment  {
            display: flex; /* 버튼이 가로로 나란히 배치 */
            flex-direction: row; /* 가로 방향 정렬 */
            align-items: center; /* 버튼들을 수직 가운데 정렬 */
            justify-content: flex-start; /* 버튼을 왼쪽 정렬 */
            gap: 10px; /* 버튼 간격 설정 */
            margin-top: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); /* 댓글 박스 그림자 */
        }

        .edit-comment-input {
            display: block; /* 수정 입력 필드를 표시 */
        }

        .post-footer {
            margin-top: 30px;
            padding: 20px 0;
            border-top: 1px solid #ddd;
            text-align: center;
        }

        .share-section {
            display: inline-block;
            margin-top: 10px;
        }

        #shareBtn {
            padding: 5px 10px; /* 버튼 내 여백 줄이기 */
            height: 30px; /* 버튼 높이 설정 */
            width: auto; /* 버튼 너비 자동으로 설정 */
            border-radius: 4px; /* 모서리 둥글게 */
            font-size: 16px;
            cursor: pointer;
            background-color: #fff9f0;
            color: black;
        }

        #shareBtn:hover {
            transform: scale(1.05);
            color: #000;
        }

    </style>
    <script th:inline="javascript" defer>
        function handleLikeDislike(event, action, commentId) {
            console.log("Comment ID:", commentId);
            event.preventDefault();

            // 사용자 로그인 ID 확인
            var userLoginId = /*[[${userInfo != null ? userInfo.user_login_id : 'null'}]]*/ 'null';
            console.log("User Login ID in handleLikeDislike:", userLoginId);

            if (!userLoginId) {
                alert("로그인 후 " + (action === 'like' ? '좋아요' : '싫어요') + "를 할 수 있습니다.");
                window.location.href = '/login';
                return;
            }

            // 서버로 좋아요/싫어요 요청
            fetch(`/like/${action}/${commentId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(response => response.text().then(text => {
                    if (!response.ok) {
                        throw new Error(`HTTP status: ${response.status}, Body: ${text}`);
                    }
                    return JSON.parse(text); // JSON으로 변환
                }))
                .then(data => {
                    if (data.likeCount !== undefined && data.dislikeCount !== undefined) {
                        document.getElementById(`like-count-${commentId}`).innerText = data.likeCount;
                        document.getElementById(`dislike-count-${commentId}`).innerText = data.dislikeCount;
                    } else {
                        alert("오류가 발생했습니다. 다시 시도해주세요.");
                    }
                })
                .catch(error => {
                    console.error("Fetch error:", error.message);
                    alert(`오류가 발생했습니다: ${error.message}`);
                });
        }

        function deleteComment(button) {
            const commentId = button.getAttribute("data-comment-id");
            if (!commentId) {
                alert("잘못된 댓글 ID입니다.");
                return;
            }

            if (confirm("댓글을 삭제하시겠습니까?")) {
                fetch(`/post/comments/delete/${commentId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert("댓글이 삭제되었습니다.");
                            // 삭제된 댓글을 화면에서 제거
                            document.getElementById(`comment-${commentId}`).remove();
                        } else {
                            alert("댓글 삭제에 실패했습니다.");
                        }
                    })
                    .catch(error => {
                        console.error("댓글 삭제 중 오류 발생:", error);
                        alert("댓글 삭제 중 오류가 발생했습니다.");
                    });
            }
        }

        document.getElementById('shareBtn').addEventListener('click', function () {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '이 게시글을 확인해 보세요!',
                    url: window.location.href
                }).then(() => {
                    alert('공유가 성공적으로 완료되었습니다!');
                }).catch((error) => {
                    console.error('공유 중 오류가 발생했습니다:', error);
                });
            } else {
                alert('공유 기능이 이 브라우저에서 지원되지 않습니다.');
            }
        });
    </script>
</head>
<body th:attr="data-user-login-id=${userInfo != null ? userInfo.user_login_id : ''}">
<header>
    <!-- Header Start -->
    <div class="header-bottom header-sticky"
         style="background-color:#fff9f0; height:150px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <!-- 로고 영역 -->
        <div class="logo" style="margin-bottom: 10px; margin-top:10px">
            <a href="/mainPage"><img style="margin-top: 20px; width: 100px;" src="/assets/img/logo/munglogo.png"
                                     alt="Logo"></a>
        </div>
        <!-- 네비게이션 메뉴 영역 -->
        <nav>
            <ul class="header">
                <li class="header-li"><a href="/mainPage" style="color:#bc915e;">메인</a></li>
                <li class="header-li"><a href="/postMain" style="color:#bc915e;">게시판</a></li>
                <li class="header-li"><a href="/myPage" style="color:#bc915e;">마이페이지</a></li>
                <li class="header-li"><a href="/login" id="login" th:if="${session.userInfo == null}">로그인</a></li>
                <li class="header-li"><a href="/logout" id="logout" th:if="${session.userInfo != null}">로그아웃</a></li>
            </ul>
        </nav>
    </div>


    <!-- Header End -->
</header>
<a class="back-to-main" href="/postMain">
    <i class="fas fa-arrow-left"></i> 메인으로
</a>
<section class="blog_area section-padding">
    <div class="content-wrapper">
        <!-- 카테고리 섹션 -->
        <div class="category-section">
            <ul class="list cat-list">
                <li><a th:href="@{'/posts/category/rec'}">숙소 추천</a></li>
                <li><a th:href="@{'/posts/category/general'}">자유 게시판</a></li>
                <li><a th:href="@{'/posts/category/travel'}">여행 TIP</a></li>
            </ul>
        </div>
        <div class="row">
            <div class=" mb-5 mb-lg-0">
                <div class="blog_left_sidebar">
                    <article class="blog_item">
                        <div class="blog_details">
                            <h1 class="blog-head" th:text="${post.title}">게시글 제목</h1>

                            <!-- 수정 완료 메시지 출력 -->
                            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                                <p th:text="${successMessage}">수정이 완료되었습니다.</p>
                            </div>
                            <ul class="blog-info-link">
                                <li><span th:text="${post.user.nickname}">작성자</span></li>
                                <li><span th:text="${#temporals.format(post.created_at, 'yyyy-MM-dd HH:mm')}">작성일</span></li>
                                <li><span th:text="${post.view_count}">조회수</span></li>
                            </ul>
                            <div th:if="${base64Image != null}">
                                <!-- 이미지가 존재하면 본문에 삽입 -->
                                <img th:src="${base64Image}" alt="Uploaded Image" class="blog-image"/>
                            </div>
                            <div th:utext="${post.content}" class="post-content"></div> <!-- 게시글 내용 -->
                            <div class="post-footer">
                                <div class="share-section">
                                    <button id="shareBtn" class="btn btn-primary">
                                        <i class="fas fa-share-alt"></i> 공유하기
                                    </button>
                                </div>
                            </div>
                            <!-- 게시글 수정 및 삭제 버튼 -->
                            <div class="btn-container" th:if="${userInfo != null and post.user != null and userInfo.user_id == post.user.user_id}">
                                <form th:action="@{/update/{post_id}(post_id=${post.post_id})}" method="get">
                                    <button type="submit" class="btn btn-primary btn-common">수정</button>
                                </form>
                                <form th:action="@{/post/delete/{post_id}(post_id=${post.post_id})}" method="get" style="display:inline;">
                                    <button type="submit" class="btn btn-danger btn-common">삭제</button>
                                </form>
                            </div>
                        </div>
                    </article>
                </div>
                <!-- 댓글 영역 -->
                <div class="comment-area">
                    <h4>댓글 <span th:text="${post.comments.size()}"></span>개</h4>
                    <div class="comment-list">
                        <div th:each="comment : ${post.comments}" th:id="'comment-' + ${comment.commentId}" class="single-comment">
                            <div class="user d-flex">
                                <div class="desc">
                                    <h5 th:text="${comment.user.nickname}"></h5>
                                    <span th:text="${#temporals.format(comment.created_at, 'yyyy-MM-dd HH:mm')}"></span>
                                    <p class="comment-content" th:text="${comment.content}"></p>
                                    <textarea class="edit-comment-input" style="display: none;" th:text="${comment.content}"></textarea>

                                    <!-- 좋아요 및 싫어요 버튼 -->
                                    <div class="like-dislike-buttons">
                                        <button
                                                class="btn-like"
                                                th:attr="data-comment-id=${comment.commentId}"
                                                onclick="handleLikeDislike(event, 'like', this.getAttribute('data-comment-id'))">
                                            👍
                                        </button>
                                        <span th:id="'like-count-' + ${comment.commentId}" th:text="${comment.likeCount}">0</span>
                                        <button
                                                class="btn-dislike"
                                                th:attr="data-comment-id=${comment.commentId}"
                                                onclick="handleLikeDislike(event, 'dislike', this.getAttribute('data-comment-id'))">
                                            👎
                                        </button>
                                        <span th:id="'dislike-count-' + ${comment.commentId}" th:text="${comment.dislikeCount}">0</span>
                                    </div>

                                    <!-- 댓글 수정/삭제 버튼 -->
                                    <div th:if="${userInfo != null and userInfo.user_id == comment.user.user_id}">
                                        <!-- 삭제 버튼 -->
                                        <form th:action="@{/post/comments/delete/{comment_id}(comment_id=${comment.commentId})}" method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-danger">삭제</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 댓글 작성 -->
                    <div class="comment-form">
