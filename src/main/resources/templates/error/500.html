<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>500 Internal Server Error</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">
<div class="text-center">
  <h1 class="display-1 fw-bold text-warning">500</h1>
  <h2 class="mb-3">Oops! Something Went Wrong</h2>
  <p class="lead mb-4 text-muted">The server encountered an unexpected condition.</p>
  <a th:href="@{${referer}}" class="btn btn-primary btn-lg">Back to Dashboard</a>
</div>
<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
