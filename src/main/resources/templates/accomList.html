<!doctype html>
<html class="no-js" lang="zxx" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Travel HTML-5 Template </title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="site.webmanifest">
    <link rel="shortcut icon" type="image/x-icon" href="../static/assets/img/favicon.ico">

    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="/assets/css/flaticon.css">
    <link rel="stylesheet" href="/assets/css/slicknav.css">
    <link rel="stylesheet" href="/assets/css/animate.min.css">
    <link rel="stylesheet" href="/assets/css/magnific-popup.css">
    <link rel="stylesheet" href="/assets/css/fontawesome-all.min.css">
    <link rel="stylesheet" href="/assets/css/themify-icons.css">
    <link rel="stylesheet" href="/assets/css/slick.css">
    <link rel="stylesheet" href="/assets/css/nice-select.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="https://example.com/static/assets/img/favicon.ico">

    <style>
        .header {
            list-style-type: none;
            margin: 7px 5px 10px 0;
            padding: 0;
            overflow: hidden;
        }
        .header-li {
            float: left;
            margin-left : 10px;
        }
        #login , #logout {
            background-color: #bc915e;
            border: none;
            height: 35px;
            margin-left: 2px;
        }
        #login:hover{
            background-color: #fff9f0;
            border: solid 3px  #bc915e;
            color : #bc915e;
        }
        #logout:hover{
            background-color: #fff9f0;
            border: solid 3px  #bc915e;
            color : #bc915e;
        }
        nav ul li {
            height: 30px;
            margin: 10px;
        }
        nav ul li :hover {
            background-color: #fff9f0;
            border: solid 3px  #bc915e;
        }
        #search{
            height : 60px;
            width : 150px;
            background-color :  #ecd9bf;
            border : none;
        }

        #search:hover {
            background-color: #bc915e;
            cursor: pointer;

        }
        /* 부모에 pointer-events가 적용되어 있지 않은지 확인 */
        * {
            pointer-events: auto;
        }


        /* nice-select 스타일을 비활성화하기 */
        .nice-select {
            display: none !important; /* nice-select 숨기기 */
        }

        select {
            display: block !important; /* 원래 select 요소를 보이게 하기 */
        }

        #accom_location {
            width: 250px;
            height: 50px;
            font-size: 18px;
            color : grey;
            padding: 5px;
            border: solid 4px #bc915e;
            cursor: pointer;
            position: relative;  /* 상대 위치 지정 */
            z-index: 10; /* 다른 요소들과 겹치지 않게 설정 */

        }

        .search-box {
            display: flex;
            justify-content: center; /* 수평 중앙 정렬 */
            align-items: center; /* 수직 중앙 정렬 */
            margin: 0 auto; /* 양쪽 여백을 자동으로 설정해 가로 중앙 배치 */
            box-sizing: border-box; /* padding이 너비에 포함되도록 설정 */
        }
        /*옆 사이드바 */
        .container{
            padding : 50px;
            display : grid;
            grid-template-columns : 300px 3fr;
            gap : 20px;
        }

        .side-bar {
            background-color: #fffcfa; /* 사이드바 배경 */
            padding: 10px;
        }
        .content {
            padding: 20px;
            overflow-y: auto; /* 숙소 목록이 많으면 스크롤 가능 */
        }


        /*range start*/
        #control {
            position: relative;
            width: 600;
            padding: 10px;
        }
        #control form div {
            width: 100%;
            display: flex;
            align-items: center;
            height: 40px;
        }
        #control form div input{
            -webkit-appearance: none;
            width:90%;
            height: 6px;
            background: linear-gradient(#e69e39);
            border-radius: 10px;
            box-shadow : 0 0 10px 0 #c37a15,
            0 0 10px 0 #c37a15,
            0 0 10px 0 #c37a15;
        }
        #control form div input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 40px;
            height: 40px;
            background: url('/images/dogfoot.png');
            background-repeat: no-repeat;
            background-size: cover;
            filter:drop-shadow(0 0 5px rgb(181, 108, 19));

        }
        #control form div i{
            color: #fff;
            font-size: 25px;
            width : 70px;
            height: 70px;
            background: rgb(255, 174, 0);
            text-align: center;
            line-height: 70px;
        }
        #control form div p{
            font-size: 18px;
            font-weight: 600;
            font-family: 'Courier New', Courier, monospace;
            padding-left: 10px;
            color: #bc915e;
        }
        /*range 끝*/
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background-color: #bc915e;
            color: white;
            padding: 16px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }
        /*드롭다운 끝*/

        .facility {

            display: flex;
            align-items: center;
            position: relative;

        }

        .toggle-btn {
            margin-left: 900px;
            background-color:#bc915e;
            color: white;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .checkbox-facility {
            display: flex;
            flex-direction: column; /* 체크박스를 세로로 배치 */
            margin-left: 10px; /* 버튼과 체크박스 사이의 간격 */
            position: absolute; /* 체크박스 컨테이너의 위치를 절대적으로 설정 */
            left: calc(900px + 150px); /* 버튼의 오른쪽에 배치 */
        }
        .checkbox-facility label {
            margin-right: 10px;
        }

        .btn-value {
            border : 2px solid #bc915e;
            padding : 7px;
            margin:3px;
            border-radius : 3em;
            background-color : transparent;
            color : #bc915e;
            cursor : pointer;
        }
        .active {
            background-color:#bc915e;
            color : #fff;
        }


    </style>

</head>

<script>

    // 편의시설 필터링
    const filterItems = document.querySelectorAll('.btn-value');
    const filterAccoms = document.querySelectorAll('.accoms-box');
    let activeFilter = [];

    // 편의시설 버튼 클릭 시 필터링
    filterItems.forEach((filterItem) => {
        filterItem.addEventListener('click', accomTargeting);
    });

    function accomTargeting(event) {
        const button = event.target;
        const value = event.target.dataset.value;

        // 이미 클릭한 필터를 해제하거나 새로운 필터 추가
        if (activeFilter.includes(value)) {
            activeFilter = activeFilter.filter(filter => filter !== value);
            button.style.backgroundColor = ''; // 배경 색상 초기화
            button.style.color = ''; // 텍스트 색상 초기화
        } else {
            activeFilter.push(value);
            button.style.backgroundColor = '#bc915e';
            button.style.color = 'white';
        }

        console.log('선택된 필터: '+ activeFilter);
        showAccom(); // 필터링된 숙소 표시
    }

    // 반려동물 종 필터링
    const petKinds = document.querySelectorAll('.pet-kind');
    let selectedPet = null; // 선택된 반려동물 종류
    let allowedPets = []; // 허용된 반려동물 종류 배열

    // 반려동물 범위 정의
    const petSizeMap = {
        '소형견': ['소형견'],
        '중형견': ['소형견', '중형견'],
        '대형견': ['소형견', '중형견', '대형견']
    };

    // 라디오 버튼 클릭 시 반려동물 종류 선택
    petKinds.forEach((petKind) => {
        petKind.addEventListener('change', () => {
            const selectPet = document.querySelector('input[name="pet-radio"]:checked');
            if (selectPet) {
                selectedPet = selectPet.value;
                allowedPets = petSizeMap[selectedPet] || []; // 선택된 반려동물 종류에 맞는 범위 설정
                console.log('가능한 반려동물 : '+ allowedPets);
            }
            showAccom();
        });
    });

    // 숙소 필터링
    function showAccom() {
        console.log('필터링 진행중');
        filterAccoms.forEach((accom) => {
            const amens = accom.querySelectorAll('.accom-amen');
            let match = true; // 기본적으로 모든 숙소는 표시

            // 1. 편의시설 필터링
            if (activeFilter.length > 0) {
                match = activeFilter.every(filter => {
                    return [...amens].some(amen => amen.textContent.includes(filter));
                });
                console.log('편의시설 필터링 진행중');
            }

            // 2. 반려동물 필터링
            if (allowedPets.length > 0) {
                // 숙소의 반려동물 종류 가져오기
                const petKindElement = accom.querySelector('.my-pet'); // 각 숙소의 반려동물 종류 텍스트 가져오기
                const petKind = petKindElement ? petKindElement.textContent.trim() : ''; // 반려동물 종류

                console.log('숙소의 반려동물 종류:', petKind);

                // 허용된 반려동물 배열에 해당 반려동물이 포함되는지 확인
                if (!allowedPets.includes(petKind)) {
                    match = false;
                }
                console.log('반려동물 종 필터링 진행중');
            }


            display(accom, match);
        });
    }
