<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시글 작성</title>
    <meta name="description" content="게시판 페이지">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.png">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .header {
            list-style-type: none;
            margin: 5px 5px 18px 0;
            padding: 0;
            overflow: hidden;
        }
        .header-li {
            float: left;
            margin-left : 10px;
        }

    </style>
    <script th:inline="javascript">
        function uploadImage() {
            const fileInput = document.getElementById('fileUpload');
            const contentInput = document.getElementById('content');

            if (fileInput.files.length === 0) {
                alert("파일을 선택해 주세요.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            fetch("/uploadImage", {
                method: "POST",
                body: formData
            })
                .then(response => response.text())
                .then(imageUrl => {
                    if (imageUrl) {
                        // 이미지 URL을 content에 추가
                        const imgTag = `<img src="${imageUrl}" alt="Uploaded Image" />`;
                        contentInput.value += imgTag;
                        fileInput.value = ""; // 파일 선택 초기화
                    } else {
                        alert("이미지 업로드에 실패했습니다.");
                    }
                })
                .catch(error => console.error("Error uploading image:", error));
        }
    </script>

</head>
<body>
<!-- Preloader Start -->
<div id="preloader-active">
    <div class="preloader d-flex align-items-center justify-content-center">
        <div class="preloader-inner position-relative">
            <div class="preloader-circle"></div>
            <div class="preloader-img pere-text">
                <img src="/assets/img/logo/logo.png" alt="">
            </div>
        </div>
    </div>
</div>
<!-- Preloader End -->
<header>
    <!-- Header Start -->
    <div class="header-bottom header-sticky"
         style="background-color:#fff9f0; height:150px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <!-- 로고 영역 -->
        <div class="logo" style="margin-bottom: 10px; margin-top:10px">
            <a href="/mainPage"><img style="margin-top: 20px; width: 100px;" src="/assets/img/logo/munglogo.png"
                                     alt="Logo"></a>
        </div>
        <!-- 네비게이션 메뉴 영역 -->
        <nav>
            <ul class="header">
                <li class="header-li"><a href="/mainPage" style="color:#bc915e;">메인</a></li>
                <li class="header-li"><a href="/postMain" style="color:#bc915e;">게시판</a></li>
                <li class="header-li"><a href="/myPage" style="color:#bc915e;">마이페이지</a></li>
                <li class="header-li"><a href="/login" id="login" th:if="${session.userInfo == null}">로그인</a></li>
                <li class="header-li"><a href="/logout" id="logout" th:if="${session.userInfo != null}">로그아웃</a></li>
            </ul>
        </nav>
    </div>


    <!-- Header End -->
</header>

<!-- 게시글 작성 영역 -->
<section class="blog_area section-padding">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 mb-5 mb-lg-0">
                <div class="blog_left_sidebar">
                    <h2>게시글 작성</h2>
                    <form id="postForm" method="post" enctype="multipart/form-data" th:action="@{/new}">
                        <div class="form-group">
                            <label for="category">카테고리</label>
                            <select name="category" id="category" class="form-control" required>
                                <option value="rec">숙소 추천</option>
                                <option value="general">자유 게시판</option>
                                <option value="travel">여행 TIP</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="title">제목</label>
                            <input type="text" class="form-control" id="title" name="title" placeholder="제목을 입력하세요" required>
                        </div>
                        <div class="form-group">
                            <label for="fileUpload">이미지 업로드</label>
                            <input type="file" id="fileUpload" class="form-control-file">
                            <button type="button" onclick="uploadImage()">이미지 추가</button>
                        </div>

                        <div class="form-group">
                            <label for="content">내용</label>
                            <textarea class="form-control" id="content" name="content" rows="5" placeholder="내용을 입력하세요." required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="password">비밀번호 (수정/삭제 시 확인용)</label>
                            <input type="password" class="form-control" id="password" name="password" maxlength="4" placeholder="4자리 비밀번호" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="background-color: #f2e2cc; color: black;">게시글 작성</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Footer -->
<footer>
    <div class="footer-area footer-padding footer-bg" style="background-color: #fff9f0;">
        <div class="container">
            <div class="row d-flex justify-content-between">
                <div class="col-xl-3 col-lg-3 col-md-5 col-sm-6">
                    <div class="single-footer-caption mb-50">
                        <div class="footer-logo">
                            <a href="/static"><img src="/assets/img/logo/logo.png" alt="Logo" style="height: 5em;"></a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Footer bottom -->
            <div class="row pt-padding">
                <div class="col-xl-7 col-lg-7 col-md-7">
                    <div class="footer-copy-right">
                        <p>&copy;<script>document.write(new Date().getFullYear());</script> All rights reserved</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</footer>
<!-- JS Files -->
<script src="/assets/js/vendor/jquery-1.12.4.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
