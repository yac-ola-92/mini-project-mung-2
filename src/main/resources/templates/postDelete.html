<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>게시판</title>
    <meta name="description" content="게시판 페이지">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.png">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <link rel="stylesheet" href="/assets/css/post.css">
    <script src="https://kit.fontawesome.com/748b44d03f.js" crossorigin="anonymous"></script>
    <style>
        .header {
            list-style-type: none;
            margin: 5px 5px 18px 0;
            padding: 0;
            overflow: hidden;
        }
        .header-li {
            float: left;
            margin-left : 10px;
        }

        /* 전체 컨테이너 스타일 */
        .container {
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        /* 헤더 스타일 */
        .header-area {
            background-color: #fff9f0;
        }

        /* 비밀번호 입력 폼 */
        .form-group {
            background-color: #fff9f0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            margin-bottom: 20px;
        }

        .form-group p {
            font-size: 16px;
            color: #555;
            text-align: center;
            margin-bottom: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #bc915e;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .form-group input:focus {
            border-color: #bc915e;
            outline: none;
        }

        .form-group button {
            background-color: #bc915e;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
        }

        .form-group button:hover {
            background-color: #fff9f0;
            color: #bc915e;
            border: 2px solid #bc915e;
        }

        .form-group a {
            text-align: center;
            display: block;
            margin-top: 15px;
            font-size: 16px;
            color: #bc915e;
        }

        .form-group a:hover {
            text-decoration: underline;
        }

        /* 푸터 스타일 */
        .footer-area {
            background-color: #fff9f0;
            padding: 30px;
        }

        .footer-logo img {
            height: 5em;
        }

        .footer-tittle h4 {
            color: #bc915e;
        }

        .footer-tittle ul li {
            color: #555;
        }

        .footer-tittle ul li a {
            color: #bc915e;
            text-decoration: none;
        }

        .footer-tittle ul li a:hover {
            text-decoration: underline;
        }

        /* 스타일을 적용한 버튼 */
        .btn-log {
            background-color: #bc915e;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }

        .btn-log:hover {
            background-color: #fff9f0;
            color: #bc915e;
            border: 2px solid #bc915e;
        }
    </style>
    <script>
        function checkPassword() {
            var password = document.getElementById("password").value;
            var post_id = document.querySelector('form[name="delete-form"]').querySelector('input[name="post_id"]').value;

            // 서버에 비밀번호 확인 요청 (AJAX를 통해 처리)
            fetch('/post/checkPassword', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ password: password, post_id: post_id })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.valid) {
                        document.getElementById("submitBtn").disabled = false;
                        alert('비밀번호가 확인되었습니다. 게시글을 삭제할 수 있습니다.');
                    } else {
                        alert('비밀번호가 틀렸습니다. 다시 입력해주세요.');
                        document.getElementById("password").value = ''; // 비밀번호 필드 초기화
                        document.getElementById("submitBtn").disabled = true; // 삭제 버튼 비활성화
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('서버와의 연결에 문제가 발생했습니다. 다시 시도해 주세요.');
                });
        }
    </script>
</head>
<body>
<header>
    <!-- Header Start -->
    <div class="header-bottom header-sticky"
         style="background-color:#fff9f0; height:150px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <!-- 로고 영역 -->
        <div class="logo" style="margin-bottom: 10px; margin-top:10px">
            <a href="/mainPage"><img style="margin-top: 20px; width: 100px;" src="/assets/img/logo/munglogo.png"
                                     alt="Logo"></a>
        </div>
        <!-- 네비게이션 메뉴 영역 -->
        <nav>
            <ul class="header">
                <li class="header-li"><a href="/mainPage" style="color:#bc915e;">메인</a></li>
                <li class="header-li"><a href="/postMain" style="color:#bc915e;">게시판</a></li>
                <li class="header-li"><a href="/myPage" style="color:#bc915e;">마이페이지</a></li>
                <li class="header-li"><a href="/login" id="login" th:if="${session.userInfo == null}">로그인</a></li>
                <li class="header-li"><a href="/logout" id="logout" th:if="${session.userInfo != null}">로그아웃</a></li>
            </ul>
        </nav>
    </div>


    <!-- Header End -->
</header>
<section>
    <form name="delete-form" th:action="@{/post/delete/{post_id}(post_id=${post_id})}" autocomplete="off" method="post">
        <input type="hidden" name="post_id" th:value="${post_id}">
        <p>글을 작성할 때 입력했던 비밀번호를 입력하세요.</p>
        <input type="password" id="password" name="password" maxlength="4" placeholder="비밀번호" pattern="\d{4}" title="비밀번호는 4자리 숫자여야 합니다." required>
        <button type="button" class="btn btn-outline-primary" onclick="checkPassword()" style="background-color: #f2e2cc; color: black;">비밀번호 확인</button>
        <br>
        <button type="submit" id="submitBtn" class="btn btn-outline-primary" style="background-color: #f2e2cc; color: black;" disabled>삭제</button>
        <a th:href="@{'/postMain'}" class="btn btn-outline-secondary">취소</a>
    </form>
</section>

<!-- Footer -->
<footer>
    <div class="footer-area footer-padding footer-bg" style="background-color: #fff9f0;">
        <div class="container">
            <div class="row d-flex justify-content-between">
                <div class="col-xl-3 col-lg-3 col-md-5 col-sm-6">
                    <div class="single-footer-caption mb-50">
                        <div class="footer-logo">
                            <a href="index.html"><img src="/assets/img/logo/logo.png" alt="Logo" style="height: 5em;"></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</footer>

<script src="/assets/js/vendor/jquery-1.12.4.min.js"></script>
<script src="/assets/js/popper.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
</body>
</html>
